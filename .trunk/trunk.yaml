version: 0.1
cli:
  version: 1.22.11
plugins:
  sources:
    - id: trunk
      ref: v1.6.7
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - go@1.21.0
    - node@18.20.5
    - python@3.10.8
lint:
  threshold:
    - linters: [ALL]
      level: high
  ignore:
    - linters: [ALL]
      paths:
        - polytracker/src/compiler-rt/**
        - third_party/**
    - linters: [bandit]
      paths:
        - tests/**
  definitions:
    - name: flake8
      direct_configs:
        - .flake8

  enabled:
    - taplo@0.9.3
    - actionlint@1.7.7
    - bandit@1.8.3
    - black@25.1.0
    - checkov@3.2.390
    - clang-format@16.0.3
    - flake8@7.1.2
    - git-diff-check
    - hadolint@2.12.1-beta
    - isort@6.0.1
    - markdownlint@0.44.0
    - mypy@1.15.0
    - oxipng@9.1.4
    - prettier@3.5.3
    - ruff@0.11.1
    - shellcheck@0.10.0
    - shfmt@3.6.0
    - svgo@3.3.2
    - terrascan@1.19.1
    - trivy@0.60.0
    - trufflehog@3.88.18
    - yamllint@1.36.2
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
