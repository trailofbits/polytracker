version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.7.4
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - go@1.19.5
    - node@18.12.1
    - python@3.10.8
lint:
  ignore:
    - linters: [ALL]
      paths:
        - polytracker/src/compiler-rt/**
  enabled:
    - taplo@0.8.1
    - actionlint@1.7.11
    - bandit@1.9.3
    - checkov@2.4.5
    - clang-format@16.0.3
    - git-diff-check
    - hadolint@2.14.0
    - isort@5.12.0
    - markdownlint@0.47.0
    - mypy@1.19.1
    - oxipng@8.0.0
    - prettier@3.0.2
    - ruff@0.15.2
    - shellcheck@0.11.0
    - shfmt@3.12.0
    - svgo@3.0.2
    - terrascan@1.18.3
    - trivy@0.44.1
    - trufflehog@3.48.0
    - yamllint@1.32.0
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
